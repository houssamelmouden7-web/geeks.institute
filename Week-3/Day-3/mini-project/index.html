<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬Fraja - Movies, Series & Anime</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-brand">
      <span class="brand-icon"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clapperboard preview-icon"><path d="m12.296 3.464 3.02 3.956"/><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3z"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m6.18 5.276 3.1 3.899"/></svg></span>
      <h1 class="brand-title">F<span>raja</span></h1>
    </div>

    <div class="search-box">
      <label for="search-input" class="visually-hidden">Search catalog</label>
      <input 
        type="search" 
        id="search-input" 
        placeholder="Search anime, series, or movies..."
        autocomplete="off"
      >
      <span class="search-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search preview-icon"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span>
    </div>
  </header>

  <section class="controls" aria-label="Filters and Sorting">
    <div class="category-filters" role="group" aria-label="Filter by category">
      <button class="filter-btn active" data-category="All">All</button>
      <button class="filter-btn" data-category="Anime">Anime</button>
      <button class="filter-btn" data-category="Series">Series</button>
      <button class="filter-btn" data-category="Movies">Movies</button>
    </div>

    <div class="sort-control">
      <label for="sort-select">Sort by:</label>
      <select id="sort-select">
        <option value="default">Default</option>
        <option value="rating-desc">IMDb Rating (Highest)</option>
        <option value="title-asc">Title (A-Z)</option>
        <option value="title-desc">Title (Z-A)</option>
      </select>
    </div>
  </section>

  <main class="main-content">
    <div id="cards-grid" class="cards-grid"></div>

    <div id="empty-state" class="empty-state hidden">
      <div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="116" height="116" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder-x preview-icon"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="m9.5 10.5 5 5"/><path d="m14.5 10.5-5 5"/></svg></div>
      <h2>No Results Found</h2>
      <p>We couldn't find anything matching your search criteria. Try a different keyword!</p>
    </div>
  </main>

  <div id="modal-container" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <button id="modal-close-btn" class="modal-close" aria-label="Close modal">&times;</button>
      
      <div class="modal-body">
        <img id="modal-img" src="" alt="" class="modal-poster">
        
        <div class="modal-info">
          <div class="modal-badges">
            <span id="modal-category" class="badge badge-category"></span>
            <span id="modal-rating" class="badge badge-rating"></span>
            <span id="modal-year" class="badge badge-year"></span>
          </div>

          <h2 id="modal-title" class="modal-title"></h2>
          <p id="modal-duration" class="modal-duration"></p>
          
          <div class="modal-divider"></div>
          
          <h3>Story Overview</h3>
          <p id="modal-story" class="modal-story"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
