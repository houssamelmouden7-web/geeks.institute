<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8" />
  <title>Challenge: Mad Libs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      line-height: 1.6;
    }
    form label {
      display: inline-block;
      width: 140px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    form input {
      padding: 6px 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 200px;
    }
    button {
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #shuffle-button {
      background-color: #28a745;
    }
    #shuffle-button:hover {
      background-color: #1e7e34;
    }
    p {
      margin-top: 25px;
      font-size: 18px;
    }
    #story {
      font-weight: bold;
      color: #d9534f;
    }
  </style>
 </head>
 <body>

    <h1>Mad Libs Game</h1>

    <form id="libform">
        <label for="noun">Noun:</label>
        <input type="text" id="noun"><br>

        <label for="adjective">Adjective:</label>
        <input type="text" id="adjective"><br>

        <label for="person">Someone's Name:</label>
        <input type="text" id="person"><br>

        <label for="verb">Verb:</label>
        <input type="text" id="verb"><br>

        <label for="place">A place:</label>
        <input type="text" id="place"><br>

        <button id="lib-button" type="submit">Lib it!</button>
        <button id="shuffle-button" type="button">Shuffle Story</button>
    </form>

    <p>Generated story: 
      <span id="story"></span>
    </p>

    <script src="script.js"></script>

 </body>
</html>
